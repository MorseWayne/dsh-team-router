# dsh-team-router 1.0.0 routing V3 example. Prefer the Team task routing settings.
# Replace YOUR_* with exact IDs from the Host catalog. Saving this config does
# not grant model access: authorize the pair for the Session before delegating.
- id: team-router
  config:
    routing:
      version: 3
      defaultTarget: { mode: inherit }
      behavior:
        guidance: true
        delegationMode: passive  # passive | specialist-first | orchestrator
        strict: false
      builtins:
        deep:
          binding:
            mode: explicit
            provider: YOUR_PROVIDER_ID
            model: YOUR_MODEL_ID
            # reasoningEffort: high  # Only when advertised by this exact model.
        artistry: { enabled: false }
      custom:
        - id: custom-evidence-check
          name: Evidence verification
          purpose: Verify a specific-version API or docs and cite sources and uncertainties.
          avoid: Use writing when the task is to organize a manual.
          enabled: true
          proactive: false
          binding: { mode: default }
      historyLimit: 100
