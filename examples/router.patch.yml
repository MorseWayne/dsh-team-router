# V2 shape reference. Prefer the native settings editor / ConfigEditor to save.
# A nonempty legacy configuration requires explicit migration confirmation first.
# Replace YOUR_* with exact IDs from the Host catalog and authorize them for the
# Session before delegating; saving a model does not grant model access.
- id: team-router
  config:
    policyV2:
      version: 2
      defaultTarget:
        executor: native
        model: { mode: inherit }
      categories:
        visual-engineering: { mode: default }
        ultrabrain: { mode: default }
        deep:
          mode: target
          target:
            executor: native
            model:
              mode: explicit
              provider: YOUR_PROVIDER_ID
              id: YOUR_MODEL_ID
              # reasoningEffort: high # Only when advertised by this exact model.
        artistry: { mode: default }
        quick: { mode: default }
        unspecified: { mode: default }
        writing: { mode: default }
      historyLimit: 100
# Codex, agy and Cursor targets are structurally represented in V2 but currently
# refused at execution until their managed integration passes its safety gates.
