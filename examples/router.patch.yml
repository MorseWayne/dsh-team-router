# dsh-team-router routing V3 example (1.0.0 base). Prefer the Team task routing settings.
# Replace YOUR_* with exact IDs from the Host catalog. Direct config edits do not
# grant model access. Save in Team task routing settings to sync profile grants,
# then start a new Session (existing Sessions keep their authorization).
- id: team-router
  config:
    routing:
      version: 3
      defaultTarget: { mode: inherit }
      behavior:
        guidance: true
        delegationMode: passive  # passive | specialist-first | orchestrator
        strict: false
      builtins:
        # Uncomment only on scout-enabled builds to opt in to read-only discovery.
        # scout: { enabled: true }
        deep:
          binding:
            mode: explicit
            provider: YOUR_PROVIDER_ID
            model: YOUR_MODEL_ID
            # reasoningEffort: high  # Only when advertised by this exact model.
        artistry: { enabled: false }
      custom:
        - id: custom-evidence-check
          name: Evidence verification
          purpose: Cross-check a specific claim against sources; list supporting, conflicting and unverified points.
          avoid: Not for open-ended fact gathering or organizing a manual.
          enabled: true
          proactive: false
          binding: { mode: default }
      historyLimit: 100
