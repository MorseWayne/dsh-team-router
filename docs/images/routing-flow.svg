<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="dsh-team-router 路由工作原理流程图">
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#3B8276"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6374A8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#547DAE"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="1118" height="468" rx="18" fill="#F8FAFC" stroke="#DCE5F0" stroke-width="1.5"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="36" y="40" fill="#0F172A" font-size="18" font-weight="700">工作机制：按交付物提供路由指引，不替主助手越权调用</text>
    <rect x="832" y="18" width="252" height="28" rx="14" fill="#E6F4F1" stroke="#A7D8CE"/>
    <text x="958" y="36.5" text-anchor="middle" fill="#1F5E54" font-size="12" font-weight="600">DSH Web 默认开箱支持原生 subagent</text>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke-width="2">
    <!-- Col 1 -> Col 2 -->
    <path d="M 206 232 L 244 232" stroke="#547DAE" marker-end="url(#arrowBlue)"/>

    <!-- Col 2 -> 3 Branches -->
    <path d="M 454 232 C 482 232, 476 112, 504 112" stroke="#94A3B8" marker-end="url(#arrowSlate)"/>
    <path d="M 454 232 L 504 232" stroke="#3B8276" stroke-width="2.6" marker-end="url(#arrowTeal)"/>
    <path d="M 454 232 C 482 232, 476 346, 504 346" stroke="#6374A8" marker-end="url(#arrowIndigo)"/>

    <!-- Col 3 -> Col 4 -->
    <path d="M 776 112 L 812 112" stroke="#94A3B8" marker-end="url(#arrowSlate)"/>
    <path d="M 776 232 L 812 232" stroke="#3B8276" stroke-width="2.6" marker-end="url(#arrowTeal)"/>
    <path d="M 776 346 L 812 346" stroke="#6374A8" marker-end="url(#arrowIndigo)"/>
  </g>

  <!-- Column 1: User Request -->
  <g transform="translate(36, 174)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="170" height="116" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="22" rx="6" fill="#F1F5F9"/>
    <text x="46" y="31" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="600">用户提问</text>
    <text x="16" y="62" fill="#0F172A" font-size="15" font-weight="700">提出任务需求</text>
    <text x="16" y="84" fill="#64748B" font-size="12">例：重做登录页、查</text>
    <text x="16" y="102" fill="#64748B" font-size="12">偶发 Bug 或写文档</text>
  </g>

  <!-- Column 2: Lead + Active Registry -->
  <g transform="translate(248, 148)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="206" height="168" rx="14" fill="#EEF4FB" stroke="#547DAE" stroke-width="1.8"/>
    <rect x="16" y="16" width="96" height="22" rx="6" fill="#547DAE"/>
    <text x="64" y="31" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="600">主助手 · 活跃清单</text>
    <text x="16" y="62" fill="#0F172A" font-size="15.5" font-weight="700">判断类别与分工</text>
    <text x="16" y="88" fill="#334155" font-size="12">• 仅参考已启用且已授权类别</text>
    <text x="16" y="110" fill="#334155" font-size="12">• 同模型配置自动合并瘦身</text>
    <text x="16" y="132" fill="#334155" font-size="12">• 主动模式首步追加紧凑提醒</text>
    <text x="16" y="154" fill="#547DAE" font-size="11.5" font-weight="600">始终服从用户直接执行要求</text>
  </g>

  <!-- Branch 1: Direct -->
  <g transform="translate(508, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="84" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="16" y="28" fill="#475569" font-size="12" font-weight="700">路径 1 · 主助手直接处理</text>
    <text x="16" y="51" fill="#0F172A" font-size="13.5" font-weight="600">简单问答、澄清或极小改动</text>
    <text x="16" y="71" fill="#64748B" font-size="12">或用户明确要求主助手直接答复</text>
  </g>
  <g transform="translate(816, 70)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="84" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="16" y="32" fill="#0F172A" font-size="14" font-weight="700">直接输出回答</text>
    <text x="16" y="56" fill="#64748B" font-size="12">零派单延迟，不产生多余子会话</text>
  </g>

  <!-- Branch 2: Native Subagent (Highlighted) -->
  <g transform="translate(508, 178)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="108" rx="12" fill="#ECF7F4" stroke="#3B8276" stroke-width="1.8"/>
    <rect x="16" y="12" width="154" height="22" rx="6" fill="#3B8276"/>
    <text x="93" y="27" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="600">路径 2 · 原生 subagent（主推）</text>
    <text x="16" y="57" fill="#0F172A" font-size="14" font-weight="700">按活跃路由表填入模型参数</text>
    <text x="16" y="79" fill="#1F5E54" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">provider / model / reasoning_effort</text>
    <text x="16" y="97" fill="#475569" font-size="11.5">无需开启团队协作，开箱即可跨厂商分工</text>
  </g>
  <g transform="translate(816, 178)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="108" rx="12" fill="#FFFFFF" stroke="#3B8276" stroke-width="1.8"/>
    <text x="16" y="30" fill="#0F172A" font-size="14" font-weight="700">专长执行 + 可选严格校验</text>
    <text x="16" y="54" fill="#334155" font-size="12">• 开启 strict 时自动拦截跑偏模型并重试</text>
    <text x="16" y="75" fill="#334155" font-size="12">• 全继承时防私传模型；全停用时不阻塞</text>
    <text x="16" y="96" fill="#1F5E54" font-size="12" font-weight="600">✓ 专长子助手完成后由主助手验收汇总</text>
  </g>

  <!-- Branch 3: Team Delegation -->
  <g transform="translate(508, 306)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="80" rx="12" fill="#F4F5FA" stroke="#7889B6" stroke-width="1.4"/>
    <text x="16" y="26" fill="#495A8A" font-size="12" font-weight="700">路径 3 · 团队分类委派（兜底 / 团队模式）</text>
    <text x="16" y="49" fill="#0F172A" font-size="13.5" font-weight="600">Lead 调用 team_route_delegate</text>
    <text x="16" y="69" fill="#64748B" font-size="12">传入活跃类别 ID，并附带清晰交卷标准</text>
  </g>
  <g transform="translate(816, 306)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="268" height="80" rx="12" fill="#FFFFFF" stroke="#7889B6" stroke-width="1.4"/>
    <text x="16" y="28" fill="#0F172A" font-size="14" font-weight="700">团队调度 &amp; 独立历史留档</text>
    <text x="16" y="51" fill="#334155" font-size="12">team_route_status 实时查询状态</text>
    <text x="16" y="70" fill="#64748B" font-size="11.5">删改自定义类别后历史记录仍清晰可读</text>
  </g>

  <!-- Footer Guarantee Bar -->
  <g transform="translate(36, 408)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">
    <rect x="0" y="0" width="1048" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="21" r="4.5" fill="#547DAE"/>
    <text x="36" y="25.5" fill="#334155"><tspan font-weight="700" fill="#0F172A">自动补齐授权：</tspan>保存时只授权生效的显式模型，绝不误删已有授权</text>

    <circle cx="436" cy="21" r="4.5" fill="#3B8276"/>
    <text x="448" y="25.5" fill="#334155"><tspan font-weight="700" fill="#0F172A">停用即彻底退出：</tspan>保留原绑定，不占提示词与校验</text>

    <circle cx="784" cy="21" r="4.5" fill="#7889B6"/>
    <text x="796" y="25.5" fill="#334155"><tspan font-weight="700" fill="#0F172A">清晰边界：</tspan>不越权执行外部 CLI</text>
  </g>
</svg>
