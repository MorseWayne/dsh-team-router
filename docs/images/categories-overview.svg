    <path d="M 14 0 L 500 0 Q 514 0 514 14 L 514 40 L 0 40 L 0 14 Q 0 0 14 0 Z" fill="#F1F5F9"/>
    <circle cx="22" cy="20" r="5" fill="#64748B"/>
