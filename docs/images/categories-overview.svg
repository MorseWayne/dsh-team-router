      <text x="12" y="22.5" fill="#0F172A" font-size="13" font-weight="700">通用兜底</text>
      <text x="80" y="22.5" fill="#64748B" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">unspecified</text>
      <text x="174" y="22.5" fill="#475569" font-size="12">确实不属以上任何类别的最后选择</text>
      <rect x="434" y="8" width="44" height="20" rx="5" fill="#DCEBFA"/>
      <text x="456" y="21.5" text-anchor="middle" fill="#2F598A" font-size="10.5" font-weight="700">精简7</text>
    </g>
    <text x="22" y="151" fill="#64748B" font-size="11.5">✦ 不触发主动委派提醒，防止小问题被无谓派单</text>
  </g>

  <!-- Custom Categories Section -->
