    <text x="20" y="29" fill="#0F172A" font-size="14.5" font-weight="700">自定义类别扩展区（最多 8 个）</text>
    <text x="260" y="29" fill="#547DAE" font-size="12" font-weight="600">支持空白新建，或从以下 4 张内置场景模板卡一键起步</text>
    <text x="1028" y="29" text-anchor="end" fill="#64748B" font-size="11.5">新建默认不主动派单 · 删改不影响历史</text>

    <!-- Template 1 -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="242" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
