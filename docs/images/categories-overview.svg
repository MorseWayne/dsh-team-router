    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="486" height="36" rx="8" fill="#F8FAFC"/>
      <text x="12" y="22.5" fill="#0F172A" font-size="13" font-weight="700">定向小任务</text>
      <text x="90" y="22.5" fill="#64748B" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">quick</text>
      <text x="142" y="22.5" fill="#475569" font-size="12">做法明确、范围小、验收简单的改动</text>
      <rect x="434" y="8" width="44" height="20" rx="5" fill="#DCEBFA"/>
      <text x="456" y="21.5" text-anchor="middle" fill="#2F598A" font-size="10.5" font-weight="700">精简7</text>
    </g>
    <!-- Row 2 -->
