      <rect x="434" y="6" width="44" height="20" rx="5" fill="#DCEBFA"/>
      <text x="456" y="19.5" text-anchor="middle" fill="#2F598A" font-size="10.5" font-weight="700">精简7</text>
    </g>
    <!-- Row 2 -->
