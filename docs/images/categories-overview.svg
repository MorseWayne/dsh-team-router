<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 674" width="1120" height="674" role="img" aria-label="13 个内置类别与 4 张自定义场景模板全景图">
  <!-- Outer Card -->
  <rect x="1" y="1" width="1118" height="672" rx="18" fill="#F8FAFC" stroke="#DCE5F0" stroke-width="1.5"/>

  <!-- Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="36" y="40" fill="#0F172A" font-size="18" font-weight="700">分工全景：4 大工作组 13 个内置类别 + 最多 8 个自定义类别</text>
    <!-- Legend -->
    <rect x="752" y="19" width="154" height="26" rx="13" fill="#EEF4FB" stroke="#BDD2EC"/>
    <text x="829" y="36" text-anchor="middle" fill="#2F598A" font-size="11.5" font-weight="600">精简7 = 精简 7 类预设包含</text>
    <rect x="918" y="19" width="166" height="26" rx="13" fill="#E6F4F1" stroke="#A7D8CE"/>
    <text x="1001" y="36" text-anchor="middle" fill="#1F5E54" font-size="11.5" font-weight="600">全 13 类均支持逐个启停</text>
  </g>

  <!-- Group 1: Product & Engineering (Top Left) -->
  <g transform="translate(36, 66)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
