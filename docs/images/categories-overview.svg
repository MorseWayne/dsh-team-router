      <text x="12" y="20.5" fill="#0F172A" font-size="13" font-weight="700">信息侦察</text>
      <text x="84" y="20.5" fill="#58699B" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">scout</text>
      <text x="152" y="20.5" fill="#475569" font-size="12">只读收集证据，列出出处与盲区</text>
    </g>
  </g>

  <!-- Group 4: General & Fallback (Bottom Right) -->
