      <rect x="434" y="6" width="44" height="20" rx="5" fill="#DCEBFA"/>
      <text x="456" y="19.5" text-anchor="middle" fill="#2F598A" font-size="10.5" font-weight="700">精简7</text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="486" height="32" rx="8" fill="#F8FAFC"/>
      <text x="12" y="20.5" fill="#0F172A" font-size="13" font-weight="700">技术写作</text>
      <text x="84" y="20.5" fill="#58699B" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">writing</text>
