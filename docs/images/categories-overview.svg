      <text x="14" y="42" fill="#547DAE" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">custom-evidence-check</text>
      <text x="14" y="64" fill="#475569" font-size="11.5">核验具体主张：支持、矛盾或未证实</text>
    </g>

    <!-- Template 2 -->
    <g transform="translate(275, 44)">
      <rect x="0" y="0" width="242" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="24" fill="#0F172A" font-size="13.5" font-weight="700">防御性安全审计</text>
      <text x="14" y="42" fill="#2E7D6F" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">custom-security-audit</text>
      <text x="14" y="64" fill="#475569" font-size="11.5">输出风险位置、边界与缓解建议</text>
    </g>

    <!-- Template 3 -->
    <g transform="translate(530, 44)">
      <rect x="0" y="0" width="242" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="24" fill="#0F172A" font-size="13.5" font-weight="700">数据与模型评测</text>
      <text x="14" y="42" fill="#58699B" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">custom-data-eval</text>
      <text x="14" y="64" fill="#475569" font-size="11.5">实验结论、置信边界与指标设计</text>
    </g>

    <!-- Template 4 -->
    <g transform="translate(785, 44)">
      <rect x="0" y="0" width="243" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="24" fill="#0F172A" font-size="13.5" font-weight="700">行为保持的重构迁移</text>
      <text x="14" y="42" fill="#B47228" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">custom-safe-migration</text>
      <text x="14" y="64" fill="#475569" font-size="11.5">跨模块迁移、不变量与回滚方案</text>
    </g>
