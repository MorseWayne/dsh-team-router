    <!-- Row 2 -->
    <g transform="translate(14, 92)">
      <rect x="0" y="0" width="486" height="34" rx="8" fill="#F8FAFC"/>
      <text x="12" y="21.5" fill="#0F172A" font-size="13" font-weight="700">代码审查</text>
      <text x="82" y="21.5" fill="#2E7D6F" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">code-review</text>
