    <text x="36" y="25" fill="#1E3A5F" font-size="14" font-weight="700">1. 产品与工程实现</text>
    <text x="496" y="25" text-anchor="end" fill="#547DAE" font-size="11.5" font-weight="600">4 项 · 支持主动派单</text>

    <!-- Row 1 -->
    <g transform="translate(14, 50)">
