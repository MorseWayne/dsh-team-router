      <text x="102" y="20.5" fill="#547DAE" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace">deep</text>
      <text x="148" y="20.5" fill="#475569" font-size="12">跨模块端到端工程实施与集成验证</text>
      <rect x="434" y="6" width="44" height="20" rx="5" fill="#DCEBFA"/>
      <text x="456" y="19.5" text-anchor="middle" fill="#2F598A" font-size="10.5" font-weight="700">精简7</text>
