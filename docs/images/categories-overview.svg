    <rect x="0" y="0" width="514" height="206" rx="14" fill="#FFFFFF" stroke="#CBE5DF" stroke-width="1.4"/>
    <path d="M 14 0 L 500 0 Q 514 0 514 14 L 514 40 L 0 40 L 0 14 Q 0 0 14 0 Z" fill="#EAF6F3"/>
