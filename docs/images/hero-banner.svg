<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="dsh-team-router 横幅：让最拿手的模型干最擅长的活">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1729"/>
      <stop offset="55%" stop-color="#152640"/>
      <stop offset="100%" stop-color="#132C30"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#547DAE" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#6E9B90" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D1729" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#547DAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="lineTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#547DAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="lineIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#547DAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="lineAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#547DAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bgGrad)"/>
