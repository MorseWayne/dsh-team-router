      <rect x="196" y="16" width="54" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="223" y="32" text-anchor="middle" fill="#93C5FD" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">UI/FE</text>
