    <text x="445" y="21.5" text-anchor="middle" fill="#E2E8F0">同模合并 · 自动授权</text>
  </g>

  <!-- Right Routing Visual -->
  <!-- Routing Curves -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 792 180 C 836 180, 836 74, 880 74" stroke="url(#lineBlue)"/>
    <path d="M 792 180 C 836 180, 836 144, 880 144" stroke="url(#lineTeal)"/>
    <path d="M 792 180 C 836 180, 836 214, 880 214" stroke="url(#lineIndigo)"/>
    <path d="M 792 180 C 836 180, 836 284, 880 284" stroke="url(#lineAmber)"/>
  </g>

