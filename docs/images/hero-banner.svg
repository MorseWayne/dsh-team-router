    <circle cx="80" cy="24" r="4" fill="#6EE7B7"/>
    <text x="92" y="29" fill="#E2E8F0" font-size="12.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">DeepSeek Harness 插件 · v1.1.0</text>
  </g>

  <!-- Main Heading & Copy -->
  <text x="60" y="156" fill="#F8FAFC" font-size="44" font-weight="800" letter-spacing="-0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsh-team-router</text>
  <text x="60" y="200" fill="#86EFAC" font-size="22" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">让最拿手的模型，干最擅长的活</text>
  <text x="60" y="236" fill="#CBD5E1" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">按任务交付物自动为 DSH 原生子智能体与团队匹配最合适的专长模型</text>

