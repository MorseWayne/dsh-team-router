  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Left Brand Area -->
  <g transform="translate(60, 50)">
    <!-- Brand Icon Container matching icon.svg -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <g transform="translate(6, 6)">
      <path d="M12 18H19M19 18V10H24M19 18V26H24" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="5" y="14" width="8" height="8" rx="2.5" fill="#60A5FA"/>
      <rect x="24" y="6" width="7" height="8" rx="2.5" fill="#6EE7B7"/>
      <rect x="24" y="22" width="7" height="8" rx="2.5" fill="#A5B4FC"/>
    </g>

