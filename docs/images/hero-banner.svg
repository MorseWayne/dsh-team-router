      <rect x="0" y="0" width="264" height="56" rx="12" fill="#1E293B" fill-opacity="0.92" stroke="#5EEAD4" stroke-opacity="0.45"/>
      <circle cx="0" cy="28" r="4.5" fill="#5EEAD4"/>
      <circle cx="22" cy="28" r="5" fill="#5EEAD4"/>
      <text x="38" y="25" fill="#F8FAFC" font-size="14" font-weight="700">故障诊断 · 代码审查</text>
      <text x="38" y="43" fill="#94A3B8" font-size="11.5">查清根因 · 风险审阅 · CI</text>
      <rect x="196" y="16" width="54" height="24" rx="6" fill="#14B8A6" fill-opacity="0.2"/>
      <text x="223" y="32" text-anchor="middle" fill="#99F6E4" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">QA</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(880, 186)">
      <rect x="0" y="0" width="264" height="56" rx="12" fill="#1E293B" fill-opacity="0.92" stroke="#A5B4FC" stroke-opacity="0.45"/>
      <circle cx="0" cy="28" r="4.5" fill="#A5B4FC"/>
      <circle cx="22" cy="28" r="5" fill="#A5B4FC"/>
      <text x="38" y="25" fill="#F8FAFC" font-size="14" font-weight="700">架构推理 · 技术写作</text>
      <text x="38" y="43" fill="#94A3B8" font-size="11.5">只读侦察 · 论证 · 创意文稿</text>
      <rect x="196" y="16" width="54" height="24" rx="6" fill="#6366F1" fill-opacity="0.22"/>
      <text x="223" y="32" text-anchor="middle" fill="#C7D2FE" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">THINK</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(880, 256)">
      <rect x="0" y="0" width="264" height="56" rx="12" fill="#1E293B" fill-opacity="0.92" stroke="#FCD34D" stroke-opacity="0.45"/>
      <circle cx="0" cy="28" r="4.5" fill="#FCD34D"/>
      <circle cx="22" cy="28" r="5" fill="#FCD34D"/>
      <text x="38" y="25" fill="#F8FAFC" font-size="14" font-weight="700">自定义专长类别</text>
      <text x="38" y="43" fill="#94A3B8" font-size="11.5">证据核验 · 安全审计 · 评测</text>
      <rect x="192" y="16" width="58" height="24" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="221" y="32" text-anchor="middle" fill="#FDE68A" font-size="11" font-family="'SFMono-Regular', Consolas, monospace">custom</text>
